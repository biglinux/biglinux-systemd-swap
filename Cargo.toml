[package]
name = "systemd-swap"
version = "0.2.0"
edition = "2021"
authors = ["Timofey Titovets", "BigLinux Team"]
description = "Dynamic swap management for zram, zswap, and swap files"
license = "GPL-3.0-or-later"
repository = "https://github.com/biglinux/biglinux-systemd-swap"
rust-version = "1.93"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30", features = ["fs", "poll", "process", "signal", "user"] }
libsystemd = "0.7"
glob = "0.3"
libc = "0.2"
thiserror = "2"
pathdiff = "0.2"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# caveman: cargo-machete ignore list (allow-list false positives)
[package.metadata.cargo-machete]
ignored = []

[workspace.metadata.cargo-machete]
ignored = []
