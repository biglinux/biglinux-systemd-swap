# Configuration for systemd-swap
# This file is part of systemd-swap.
# See swap.conf(5) for details.
#
# Values commented with ## are auto-detected based on hardware.
# Uncomment to override with custom values.

################################################################################
# Swap Mode
#
# auto            - Auto-detect best mode (default, recommended)
#                   - btrfs/ext4/xfs with enough disk → zram + swapfiles
#                   - LiveCD or no disk support → zram only
# zram+swapfile   - Zram + swap files (zram primary, swapfiles for overflow)
# zswap+swapfile  - Zswap + swap files (zswap compresses in kernel, writes back to disk)
# zram            - Zram only (no disk swap — LiveCD, low disk)
# manual          - Use explicit flags (zram_enabled, zswap_enabled, swapfile_enabled)
# disabled        - Disable swap management (service exits cleanly)
################################################################################

swap_mode=auto

# Manual mode only: each subsystem is off unless enabled here (yes/no).
# zram_enabled=no
# zswap_enabled=no
# swapfile_enabled=no

################################################################################
# Zram Settings (used in zram and zram+swapfile modes)
#
# Zram creates compressed block devices in RAM. zram_size is virtual
# (uncompressed) and bounds nothing in RAM; zram_mem_limit is the ceiling.
# Do not infer one from the other by assuming a ratio: the ratio drops
# exactly when the pool fills. Measured over 21,178 samples on one host,
# zstd held 3.4x while the pool stayed under 40% full and 1.93x on the
# sample taken 30 s before a reclaim deadlock.
#
# The daemon manages a pool of zram devices:
#   - Starts with ONE device sized to 95% of zram_mem_limit, so it never
#     advertises swap capacity it has no RAM to back. Compression is per-CPU
#     since Linux 4.7, so a second device would add no throughput, only cost.
#   - Expands when utilization > 85% by exactly what compression has saved:
#     a new device may add only slots the remaining RAM can back even if the
#     next data does not compress at all, measured against 65% of
#     zram_mem_limit. At 4x a 31 GB host grows past the 15 GB it starts with
#     toward zram_size; incompressible data earns nothing.
#   - Each device gets the next lower priority, so the kernel fills one at a
#     time, and each may use what it holds plus all the RAM the pool has left:
#     the limit binds only when the whole pool reaches zram_mem_limit.
#   - The last 35% of zram_mem_limit is a reserve against churn: when
#     compressible pages leave, their slots come free without the RAM to back
#     them. Once the reserve is touched, incompressible pages are written to
#     the writeback store (below) and an empty last device is removed.
#   - Contracts back toward that one device when utilization stays under 20%
#     for 120s AND the last device is under 5% full.
#
# Advertising more disksize than the pool can back is not a soft failure. The
# kernel keeps aiming reclaim at the highest-priority device, its writes fail,
# should_reclaim_retry() counts the unbacked slots as free swap, and the disk
# tier below is never asked. Measured in a VM: 1.5 million suppressed
# "Write-error on swap-device" lines, the swap files untouched at 0 bytes, and
# a hang with no OOM kill.
################################################################################

## zram_size=150%                  # Upper bound on total disksize (% of RAM). A
#                                  # ceiling the pool reaches only on data that
#                                  # compresses; it starts at 95% of zram_mem_limit.
## zram_alg=zstd                   # Compression: zstd (best ratio), lz4 (fastest), lzo
## zram_mem_limit=50%              # Ceiling on the RAM the pool may hold. This is the
#                                  # only RAM limit the kernel offers for zram. 0 removes
#                                  # it and uses zram_size directly; large capacities
#                                  # can then exhaust RAM on incompressible workloads.
## zram_prio=32767                 # Swap priority (max = 32767, higher = preferred)

# Zram Pool Tuning (advanced)
## zram_max_devices=8              # Most devices the pool may grow to (1-8)
## zram_expand_threshold=85        # Expand pool when utilization > this %
## zram_contract_threshold=20      # Contract pool when utilization < this %
## zram_expand_cooldown=10         # Seconds between expansions
## zram_contract_stability=120     # Seconds of low usage before contraction
## zram_check_interval=5           # Longest wait between checks (s); memory
#                                  # pressure (PSI) wakes the monitor at once

################################################################################
# Zram Writeback — returning RAM the pool holds for pages nobody reads
#
# A page that enters zram never leaves RAM on its own. The pool shrinks only
# when a page is faulted back in or its owner exits, so a working set that
# turned over hours ago keeps its compressed copy resident for the rest of the
# session. Measured on a 31 GB host two days in: of 5,692,421 stored pages,
# 62.8% had not been read for over 24 hours — 13.6 GB uncompressed, ~4.6 GB of
# real RAM, while only 4.1 GB was free.
#
# Writeback moves those to disk and hands the RAM back. Each device gets its own
# sparse file behind its own loop device, because the kernel opens backing_dev
# exclusively and refuses both a shared device and a plain file path. The files
# cost no disk until cold pages actually land in them.
#
# Requires a kernel with CONFIG_ZRAM_WRITEBACK and CONFIG_ZRAM_TRACK_ENTRY_ACTIME.
# Without the second one the kernel cannot report a page's age; writeback then
# stays off rather than falling back to marking every page idle, which would
# write the live working set to disk.
################################################################################

## zram_writeback_size=50%         # Disk budget for the whole pool (% of RAM). Each
#                                  # device's backing file is capped at the smallest of
#                                  # this total, its own disksize, and a quarter of free
#                                  # disk; the files are sparse, so an unclaimed ceiling
#                                  # costs nothing. The total is enforced live at each
#                                  # writeback pass against the pages the stores actually
#                                  # hold, so together they never exceed it. 0 turns
#                                  # writeback off.
## zram_writeback_path=<swapfile_path>
#                                  # Directory for the backing files. Defaults to
#                                  # swapfile_path, so the backing files sit with the swap
#                                  # files: pre-systemd-swap creates and mounts that
#                                  # directory before the daemon starts, it is a btrfs
#                                  # subvolume with NOCOW and autodefrag off, and root
#                                  # snapshots do not descend into it. The files are named
#                                  # zram-writeback-<id>, which swapfc's numeric-only
#                                  # cleanup leaves alone.
#                                  # An override must stay inside the service unit's
#                                  # ReadWritePaths= or ProtectSystem=strict refuses the
#                                  # write and writeback silently never runs.
## zram_writeback_threshold=20     # Only run when the pool holds more than this % of
#                                  # zram_mem_limit. Below a fifth of its own budget the
#                                  # pool is not what is making RAM scarce, and a pass
#                                  # would trade disk and a future fault for memory
#                                  # nothing is asking for. This used to be a percentage
#                                  # of MemTotal, which on a 31 GB host meant the pass
#                                  # never ran once in a session.
## zram_writeback_idle=3600        # Seconds a page must go untouched to qualify
## zram_writeback_interval=300     # Seconds between passes

################################################################################
# Zswap Settings (used in zswap+swapfile mode)
#
# Zswap compresses pages in the kernel before writing to disk swap.
# With ~3x ratio, 8GB RAM + 45% pool = ~10.8GB effective swap in RAM.
# The shrinker writes cold pages to disk automatically.
################################################################################

## zswap_compressor=zstd           # Compression: lz4 (fastest), zstd (balanced), lzo
## zswap_zpool=zsmalloc            # Memory allocator (zsmalloc recommended)
## zswap_max_pool_percent=45       # Max RAM % for compressed pool
## zswap_shrinker_enabled=1        # Move cold pages to disk when pool is full
## zswap_accept_threshold=80       # Resume accepting pages when pool drops to this %

################################################################################
# SwapFile - Dynamic Swap Files (overflow for zram/zswap)
#
# Creates swap files on demand when memory pressure is high.
# Files are pre-allocated with NOCOW on btrfs for safety.
# Priority is lower than zram: kernel only uses them when zram is full.
################################################################################

## swapfile_path=/swapfile         # Base path for swap files
## swapfile_chunk_size=512M        # Size of each swap file
## swapfile_max_count=28           # Maximum number of swap files
## swapfile_free_ram_perc=20       # Never remove a file while free RAM < this %
## swapfile_free_swap_perc=40      # Create a file when the files' free space < this %
## swapfile_remove_free_swap_perc=70 # Remove a file when the files' free space > this %
## swapfile_min_count=1            # Files kept even when swap is idle
## swapfile_frequency=1            # Seconds between checks while files exist (1-86400)
## swapfile_shrink_threshold=30    # A file under this % used may be removed (10-50)
## swapfile_safe_headroom=40       # % the other files must keep free after absorbing
#                                  # a removed file's pages (20-60)

################################################################################
# MGLRU (Multi-Gen LRU) Settings
#
# MGLRU protects the working set from premature eviction (kernel 6.1+).
# min_ttl_ms sets the minimum age before a page can be reclaimed.
# Higher values = more protection, less reclaim.
################################################################################

## mglru_min_ttl_ms=1000           # Pages younger than this (ms) are never reclaimed
